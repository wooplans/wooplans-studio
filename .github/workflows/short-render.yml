name: short-render
# Shorts « rendus 3D » plein écran (9:16, ~20 s, sans voix ni plan coté) sur GitHub, un job par short, en parallèle.
# Lancer : Actions > short-render > Run workflow avec une SÉLECTION (« D4-004 V3-022 », « villa », « V4 », « duplex nouveaux »,
# « tous ») : pour chaque modèle, un nouveau job <CODE>-S<n> ; les rendus d'origine sont pris directement dans R2 par le
# serveur MCP du site (secret WOOPLANS_MCP_TOKEN) et la musique est choisie dans la base Mixkit (rotation).
# Ou pousser shorts/jobs/<id>/RENDER pour relancer des jobs existants (champ « jobs » en lancement manuel).
# Sorties commitées : shorts/out/<id>.mp4 + <id>_thumb.jpg + <id>.json (musique), shorts/jobs/<id>/short.json. Aucune publication.
on:
  workflow_dispatch:
    inputs:
      selection:
        description: "Modèles : codes, villa / duplex, V4 / D5, tous ; ajouter « nouveaux » pour ceux sans short"
        required: false
      jobs:
        description: "Jobs existants à relancer (shorts/jobs/<id>), séparés par des espaces"
        required: false
  push:
    branches: [main, "ccr-*"]
    paths: ["shorts/jobs/*/RENDER"]
permissions:
  contents: write
concurrency:
  group: short-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.p.outputs.include }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: p
        env:
          SELECTION: ${{ github.event.inputs.selection }}
          JOBS: ${{ github.event.inputs.jobs }}
          WOOPLANS_MCP_TOKEN: ${{ secrets.WOOPLANS_MCP_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            JOBS=$(git diff --name-only HEAD^1 HEAD | grep -E '^shorts/jobs/[^/]+/RENDER$' | cut -d/ -f3 | tr '\n' ' ')
          fi
          echo "include=$(python3 tools/shorts_batch.py "$SELECTION" --jobs $JOBS)" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
  render:
    needs: plan
    if: needs.plan.outputs.include != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.include) }}
    env:
      WOOPLANS_MCP_TOKEN: ${{ secrets.WOOPLANS_MCP_TOKEN }}
      SHORT_MUSIC: ${{ matrix.music }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Rendus d'origine depuis R2 (${{ matrix.code }})
        if: matrix.new
        run: python tools/new_short.py "${{ matrix.code }}" "${MATRIX_JOB##*-S}"
        env:
          MATRIX_JOB: ${{ matrix.job }}
      - name: Rendu de ${{ matrix.job }} (musique ${{ matrix.music }})
        run: |
          J=${{ matrix.job }}
          python tools/make_short.py "shorts/jobs/$J" "shorts/out/$J.mp4"
          python tools/make_thumbnail.py "shorts/jobs/$J" "shorts/out/${J}_thumb.jpg"
          ffprobe -v error -show_entries stream=codec_type,width,height,duration -of compact "shorts/out/$J.mp4"
          ffmpeg -v error -i "shorts/out/$J.mp4" -vf "fps=1/2,scale=216:-1,tile=6x2" -frames:v 1 -y "shorts/out/${J}_contact.jpg"
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.job }}
          path: |
            shorts/out/${{ matrix.job }}*
            shorts/jobs/${{ matrix.job }}/short.json
          retention-days: 14
  save:
    needs: [plan, render]
    if: always() && needs.plan.outputs.include != '[]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: short-*
          path: shorts
          merge-multiple: true
      - name: Enregistrer dans shorts/
        run: |
          rm -f shorts/out/*_contact.jpg
          git config user.name "wooplans-render"; git config user.email "render@users.noreply.github.com"
          git add -f shorts/out shorts/jobs
          git commit -m "shorts : vidéos rendues" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
