name: youtube-voix
# Génère les voix Gradium (voice TsRKBRWZGYldAeEI) d'un job YouTube à partir de youtube_plan/jobs/<job>/voix_script.json,
# puis commit les .wav + .chunks.json dans le dépôt. Besoin du secret GRADIUM_API_KEY (voir SECRETS.md). AUCUNE publication.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Dossier du job (youtube_plan/jobs/<job>)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["youtube_plan/jobs/*/VOIX"]
permissions:
  contents: write
jobs:
  voix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Dépendances
        run: sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Voix Gradium
        env:
          GRADIUM_API_KEY: ${{ secrets.GRADIUM_API_KEY }}
        run: |
          JOB="${{ github.event.inputs.job }}"
          if [ -z "$JOB" ]; then JOB=$(git diff --name-only HEAD^1 HEAD | grep -E '^youtube_plan/jobs/[^/]+/VOIX$' | head -1 | cut -d/ -f3); fi
          echo "JOB=$JOB" >> "$GITHUB_ENV"
          python3 youtube_plan/engine/gen_voix.py "$JOB"
      - name: Commit des voix
        run: |
          git config user.name "wooplans-bot"
          git config user.email "noreply@wooplans.com"
          git add "youtube_plan/jobs/$JOB/voix"
          git diff --cached --quiet && { echo "rien à committer"; exit 0; }
          git commit -m "voix $JOB (Gradium)"
          git push
