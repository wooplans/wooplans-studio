name: fetch-music
# Télécharge les musiques Mixkit listées dans assets/music/FETCH.txt (« Titre|Artiste » par ligne), les analyse (tempo) et les commite.
on:
  push:
    branches: [main, "ccr-*"]
    paths: ["assets/music/FETCH.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install librosa numpy
      - run: |
          mapfile -t L < assets/music/FETCH.txt
          python tools/fetch_mixkit.py "${L[@]}"
          for f in assets/music/*.mp3; do grep -q "$(basename "$f")" assets/music/tracks.json || python tools/analyze_music.py "$f"; done
          git config user.name "wooplans-fetch"; git config user.email "fetch@users.noreply.github.com"
          git add -f assets/music && git commit -m "musiques Mixkit ajoutées" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
