name: fetch-media
# Rapatrie dans le dépôt des fichiers générés (rendus Poyo…) listés dans visite_plan/poyo/FETCH.txt : « nom URL » par ligne.
on:
  push:
    branches: [main, "ccr-*"]
    paths: ["visite_plan/poyo/FETCH.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd visite_plan/poyo
          while read -r name url; do [ -n "$name" ] && curl -sSfL -o "$name" "$url" && echo "ok $name"; done < FETCH.txt
          git config user.name "wooplans-fetch"; git config user.email "fetch@users.noreply.github.com"
          git add -f . && git commit -m "poyo: rendus rapatriés" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
