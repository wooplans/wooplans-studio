name: visite-render
# Rendu de la visite guidée d'un plan : segments rendus EN PARALLÈLE, puis assemblage (voix + sous-titres).
# Lancer : Actions > visite-render > Run workflow (job = dossier visite_plan/jobs/<job>), ou modifier visite_plan/jobs/<job>/RENDER.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Dossier du job (visite_plan/jobs/<job>)"
        required: true
        default: "V3-003"
  push:
    branches: [main, "ccr-*"]
    paths: ["visite_plan/jobs/*/RENDER"]
permissions:
  contents: write
concurrency:
  group: visite-render-${{ github.ref }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.j.outputs.jobs }}
      matrix: ${{ steps.j.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: j
        # tous les jobs dont le fichier RENDER a changé dans ce push (ou celui demandé à la main)
        run: |
          JOBS="${{ github.event.inputs.job }}"
          if [ -z "$JOBS" ]; then
            BASE="${{ github.event.before }}"
            git cat-file -e "$BASE" 2>/dev/null || BASE=HEAD~1
            JOBS=$(git diff --name-only "$BASE" HEAD | grep 'visite_plan/jobs/.*/RENDER$' | cut -d/ -f3 | sort -u | tr '\n' ' ')
          fi
          python3 - "$JOBS" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          jobs = sys.argv[1].split()
          m = [{"job": j, "seg": k} for j in jobs
               for k in range(len(json.load(open(f"visite_plan/jobs/{j}/segments.json"))))]
          print("jobs=" + json.dumps(jobs)); print("matrix=" + json.dumps(m))
          PY
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: uv-manimgx-0.1.1-${{ runner.os }}
      - name: Dépendances
        run: |
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libvulkan1
          pip install --quiet uv
          uv tool install --force manimgx   # --force : recrée le lien ~/.local/bin/manimgx quand le cache uv est restauré
      - name: Rendu ${{ matrix.job }} segment ${{ matrix.seg }}
        env:
          JOB: visite_plan/jobs/${{ matrix.job }}
          SEG: ${{ matrix.seg }}
        run: |
          export PATH="$PATH:$HOME/.local/bin"
          cd visite_plan
          JOB="$GITHUB_WORKSPACE/$JOB" manimgx render scene_visite.py VisitePlan -r 1080x1920 --fps 30 --preset veryfast --crf 18 -o "$GITHUB_WORKSPACE/seg${{ matrix.seg }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.job }}-seg${{ matrix.seg }}
          path: seg${{ matrix.seg }}.mp4
          retention-days: 2
  assemble:
    needs: [plan, render]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1          # un seul push à la fois vers la branche
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: segs
          pattern: ${{ matrix.job }}-seg*
          merge-multiple: true
      - name: Assemblage (voix + sous-titres)
        run: |
          sudo apt-get install -y -qq ffmpeg libass9 >/dev/null
          python3 visite_plan/assemble.py visite_plan/jobs/${{ matrix.job }} segs "${{ matrix.job }}.mp4"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.job }}
          path: ${{ matrix.job }}.mp4
          retention-days: 14
      - name: Publier dans visite_plan/out/
        run: |
          mkdir -p visite_plan/out
          cp "${{ matrix.job }}.mp4" "visite_plan/out/${{ matrix.job }}.mp4"
          git config user.name "wooplans-render"; git config user.email "render@users.noreply.github.com"
          git add -f visite_plan/out
          git commit -m "visite: vidéo ${{ matrix.job }}" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
