name: publish-zernio
# Programme une vidéo de visite sur les pages WooPlans (Zernio). Déclenché par l'ajout de visite_plan/jobs/<job>/PUBLISH.json
# (seulement après l'accord de Tao). Le registre anti-doublon est mis à jour sur la branche.
on:
  push:
    branches: [main, "ccr-*"]
    paths: ["visite_plan/jobs/*/PUBLISH.json"]
permissions:
  contents: write
concurrency:
  group: publish-zernio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_PROFILE_ID: ${{ secrets.ZERNIO_PROFILE_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt
      - name: Programmation
        run: |
          JOB=$(git diff --name-only HEAD~1 HEAD | grep 'visite_plan/jobs/.*/PUBLISH.json' | head -1 | xargs dirname)
          python tools/publish_zernio.py "$JOB"
      - name: Registre
        run: |
          git config user.name "wooplans-publish"; git config user.email "publish@users.noreply.github.com"
          git add registry/videos.json
          git commit -m "registre: vidéo programmée" || exit 0
          git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"
